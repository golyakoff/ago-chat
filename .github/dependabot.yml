# 17-04. Schedule: weekly, Monday 06:00 UTC - the same day and hour this repository's own
# `credential-expiry.yml` already uses, so there is one weekly cadence for automated checks rather
# than a different one per ecosystem.
version: 2

# 17-11 (golyakoff/ago-root#396): the checked-in nuget.config named the local dev feed by a Windows
# absolute path, which does not exist on Dependabot's Linux runner - a *configured* source that
# does not exist is a hard NU1301 restore error, so Dependabot's nuget updater could never even
# read this repository's dependency graph, let alone propose an update. This registry gives it a
# source that does exist for it: the same GitHub Packages feed nuget.ci.config already proves works
# for CI (adr/0018), authenticated with the same read:packages-scoped PAT, stored here as a
# Dependabot secret (separate from the identically-named Actions secret CI uses - Dependabot cannot
# read Actions secrets). No new secret: this repository already had a Dependabot secret named
# AGO_PLATFORM_PACKAGES_TOKEN before this change. nuget.config's own packageSourceMapping names this
# registry's key ("ago-platform-github") as a second, normally-absent source for "Ago.Platform.*" -
# see that file's own comment for why a mapped-but-undeclared source is not an error.
registries:
  ago-platform-github:
    type: nuget-feed
    url: https://nuget.pkg.github.com/golyakoff/index.json
    username: golyakoff
    password: ${{secrets.AGO_PLATFORM_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - ago-platform-github
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"

  # Dockerfile (root): builds all four hosts from one file, selected by --build-arg PROJECT_NAME.
  # Dependabot parses every FROM line in it, so both stages are covered by this one entry - the SDK
  # image the build stage uses and the Chiseled runtime image the final stage ships (8-00).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"

  # An unpinned or stale Action is a supply-chain surface as real as a package - ci.yml's own
  # actions/checkout, actions/setup-dotnet and actions/upload-artifact are all pinned to a major
  # version tag today, not a commit SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
