name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # This build proves it restores Ago.Platform.* as a real, published .nupkg
      # (nuget.ci.config), never as a ProjectReference. AgoPlatformDevOverride is never set here,
      # so the dev-override branch of every .csproj (Directory.Build.props) stays off - a branch
      # merged with it left on fails exactly here (repositories.md). AGO_PLATFORM_PACKAGES_TOKEN
      # is a repository secret: a classic PAT scoped to read:packages only (adr/0018) - GitHub
      # does not allow anonymous reads of NuGet packages even on a public repository.
      - name: Restore
        run: dotnet restore Ago.Chat.slnx --configfile nuget.ci.config
        env:
          AGO_PLATFORM_PACKAGES_TOKEN: ${{ secrets.AGO_PLATFORM_PACKAGES_TOKEN }}

      # 17-04: same policy as ago-platform's own CI, stated once in full there and repeated only in
      # summary here - Critical/High fails the build, Moderate/Low is reported (job log + step
      # summary) but does not, because a check that blocks every branch on an untriaged transitive Low
      # advisory nobody can act on trains people to ignore red CI rather than read it
      # (docs/runbooks/vulnerability-response.md in ago-root). `--format json` rather than the
      # command's own exit code (always 0) or its human-readable text (locale-dependent - confirmed
      # while writing this against a non-en-US machine).
      - name: Vulnerability check (dotnet list package --vulnerable)
        run: |
          set -euo pipefail
          dotnet list Ago.Chat.slnx package --vulnerable --include-transitive --no-restore \
            --configfile nuget.ci.config --format json --output-version 1 > vulnerable.json
        env:
          AGO_PLATFORM_PACKAGES_TOKEN: ${{ secrets.AGO_PLATFORM_PACKAGES_TOKEN }}

      - name: Report and gate on Critical/High
        run: |
          set -euo pipefail
          total=$(jq '[ .projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? ] | length' vulnerable.json)
          high_critical=$(jq '[ .projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? | select(.severity=="Critical" or .severity=="High") ] | length' vulnerable.json)

          echo "Vulnerable package references: $total total, $high_critical at Critical/High."
          jq -r '.projects[] as $p | ($p.frameworks[]? // empty) as $f | (($f.topLevelPackages[]? // empty), ($f.transitivePackages[]? // empty)) | . as $pkg | $pkg.vulnerabilities[]? | "  \($p.path | split("/") | last)  \($pkg.id) \($pkg.resolvedVersion // $pkg.requestedVersion)  \(.severity)  \(.advisoryurl)"' vulnerable.json

          {
            echo "### Dependency vulnerability check"
            echo
            echo "$total vulnerable package reference(s), $high_critical at Critical/High severity."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$high_critical" -gt 0 ]; then
            echo "::error::$high_critical package(s) at Critical/High severity - failing the build. See the list above."
            exit 1
          fi

      - name: Format check
        run: dotnet format Ago.Chat.slnx --verify-no-changes

      - name: Build
        run: dotnet build Ago.Chat.slnx --no-restore -c Release

      # Ago.Chat.Architecture.Tests is an ordinary test project in this solution, so the layering
      # and platform-boundary rules it encodes run here with no separate job.
      - name: Test
        run: >
          dotnet test Ago.Chat.slnx --no-build -c Release
          --logger trx --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  # `15-06`/`adr/0047`: images are published to GHCR from here, not built on the deployment node.
  # Only on `main`, and only after build-test passed - a pull request never publishes, so a fork or a
  # draft branch cannot put an image into the registry a deploy might later reach for.
  publish-images:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A repository's own GITHUB_TOKEN can write to that repository's own package feed - the same
      # property adr/0018 already relies on for the NuGet feed, so publishing needs no new secret.
      # Only *reading* a private package would, which is exactly why adr/0047 wants these public.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The Dockerfile restores Ago.Platform.* from a *folder* mounted in as a Buildx build context
      # (nuget.docker.config), because the local developer loop's feed lives outside the build
      # context. CI has no such folder - it restores from GitHub Packages - so materialise one:
      # restore into a scratch global-packages directory and copy the .nupkg files out of it. The
      # alternative, teaching the Dockerfile to authenticate against GitHub Packages itself, would
      # push AGO_PLATFORM_PACKAGES_TOKEN into the image build, and a token that never enters a build
      # cannot leak from a layer.
      - name: Materialise the Ago.Platform.* feed for the image build
        env:
          AGO_PLATFORM_PACKAGES_TOKEN: ${{ secrets.AGO_PLATFORM_PACKAGES_TOKEN }}
        run: |
          mkdir -p /tmp/nuget-feed
          dotnet restore Ago.Chat.slnx --configfile nuget.ci.config --packages /tmp/global-packages
          find /tmp/global-packages -name 'ago.platform.*.nupkg' -exec cp {} /tmp/nuget-feed/ \;
          ls -1 /tmp/nuget-feed

      # No docker/login-action: `docker login` with the workflow token does the same thing with one
      # fewer third-party action in the supply chain, and Buildx is already installed on the runner.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tagging (adr/0047): the canonical tag is the full 40-character commit SHA, because that is
      # exactly what `git rev-parse HEAD` prints - "which commit is this" becomes a string comparison
      # with nothing to decode. `main` moves and exists only for convenience; a deploy must never
      # reference it, and there is deliberately no `latest` at all, since a tag that cannot name a
      # commit cannot be rolled back to, which is the whole reason this job exists.
      # Plain `docker build` with BuildKit and a separate `docker push`, rather than
      # `buildx build --push`: this is byte-for-byte the invocation ago-deploy/k8s/build-images.sh
      # already uses on a developer machine and on the node, so an image built by CI and one built by
      # hand come out of the same command. --build-context is the reason BuildKit is required at all
      # (the Ago.Platform.* feed is a folder outside the build context, per the Dockerfile's header).
      - name: Build the four host images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          for project in Ago.Chat.Api Ago.Chat.Worker Ago.Chat.Webhooks Ago.Chat.Migrator; do
            name="ago-chat-$(echo "${project#Ago.Chat.}" | tr '[:upper:]' '[:lower:]')"
            repo="ghcr.io/${{ github.repository_owner }}/${name}"
            echo "::group::${repo}"
            docker build \
              --build-context "nugetfeed=/tmp/nuget-feed" \
              --build-arg "PROJECT_NAME=${project}" \
              --build-arg "GIT_COMMIT=${{ github.sha }}" \
              -t "${repo}:${{ github.sha }}" \
              -t "${repo}:main" \
              .
            echo "::endgroup::"
          done

      # `17-04`, and `15-06` is what makes it possible - there was nowhere to scan into before a
      # registry existed. Runs between build and push, not after push: the obvious place to bolt a
      # scan onto an existing build-then-push job is the end, but that lets a Critical/High image sit
      # in GHCR, however briefly, before anyone reacts. Scanning first means nothing this check would
      # fail ever reaches the registry from this pipeline. Same threshold as the dependency check
      # above (Critical/High fails, Moderate/Low is reported - docs/runbooks/vulnerability-response.md
      # in ago-root) and `--scanners vuln` only, deliberately: this item's own scope excludes secret
      # scanning of source, and Trivy's filesystem secret scanner is close enough to that same job to
      # stay out of it here too.
      #
      # Pinned by digest, not by a version tag or the `aquasecurity/trivy-action` wrapper: both
      # `trivy-action`'s git tags (0.0.1-0.34.2) and the `aquasec/trivy` Docker Hub image itself
      # (0.69.4-0.69.6) were compromised in March 2026 - malicious code injected via imposter commits
      # and malicious image builds respectively - which is exactly the "unpinned or stale Action is a
      # supply-chain surface" risk this item's own scope names, not a hypothetical one. The digest
      # below is `aquasec/trivy:0.74.0`, pulled and verified locally while writing this change (well
      # past the compromised range); Dependabot's github-actions/docker entries above will not bump a
      # `docker run` invocation like this one, so this digest needs updating by hand when it goes
      # stale - a real limitation of choosing the CLI form over the Action, stated rather than hidden.
      - name: Scan images for known vulnerabilities (Trivy)
        run: |
          set -euo pipefail
          fail=0
          for project in Ago.Chat.Api Ago.Chat.Worker Ago.Chat.Webhooks Ago.Chat.Migrator; do
            name="ago-chat-$(echo "${project#Ago.Chat.}" | tr '[:upper:]' '[:lower:]')"
            repo="ghcr.io/${{ github.repository_owner }}/${name}"
            echo "::group::${repo}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format table \
              "${repo}:${{ github.sha }}" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::At least one image has a Critical/High vulnerability - see the groups above. Nothing was pushed."
            exit 1
          fi

      - name: Push the four host images
        run: |
          set -euo pipefail
          for n in api worker webhooks migrator; do
            repo="ghcr.io/${{ github.repository_owner }}/ago-chat-${n}"
            docker push "${repo}:${{ github.sha }}"
            docker push "${repo}:main"
          done

      - name: Summarise what was published
        run: |
          {
            echo "### Images published"
            echo
            echo "Deploy with: \`./deploy.sh ${{ github.sha }}\` (ago-deploy/k8s, on the node)"
            echo
            for n in api worker webhooks; do
              echo "- \`ghcr.io/${{ github.repository_owner }}/ago-chat-${n}:${{ github.sha }}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
