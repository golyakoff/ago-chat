# `17-03`: the reminder that actually fires.
#
# `AGO_PLATFORM_PACKAGES_TOKEN` is a classic GitHub PAT (`adr/0018`) with a hard expiry date. When it
# expires, `Restore` in ci.yml fails in both this repository and `ago-calendar`, and the first anyone
# learns of it is a red build on unrelated work. The date was written down in a backlog file, which is
# a record and not a reminder: a backlog file does not fire.
#
# This does. It runs on a schedule rather than on a push, because the failure it warns about arrives on
# a calendar date and not on a commit, and it *fails the job* rather than printing a warning, because a
# green job with a warning in its log is a notification nobody receives.
#
# WHAT THIS CANNOT DO, stated rather than discovered later: GitHub disables scheduled workflows in a
# repository that has had no activity for 60 days. A dormant repository is therefore a dormant
# reminder. This is the best mechanism available that needs no deployment, no third party and no
# credential of its own - it is not a guarantee, and ago-root `docs/runbooks/secret-rotation.md` says
# the same thing where the rotation procedure is.
#
# Rotating the PAT means updating EXPIRES below in the same change (step 5 of that procedure). It is
# the step that gets skipped, which is exactly why the reminder lives here rather than in a document.
name: Credential expiry

on:
  schedule:
    # Monday 06:00 UTC. Weekly, because the warning window below is measured in weeks; a daily run
    # would only mean the same mail seven times.
    - cron: "0 6 * * 1"
  # So the check can be run on demand right after a rotation, to confirm the new date took.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: AGO_PLATFORM_PACKAGES_TOKEN has not expired
        env:
          # The PAT's expiry as shown by GitHub. Held in both this repository and `ago-calendar`
          # (one value, two copies - a personal account has no shared Actions secret), so a rotation
          # sets it in both and this date moves once.
          EXPIRES: "2027-08-25"
          # 30 days: long enough to create a PAT, set it in two repositories, verify a build in each
          # and revoke the old one without any of it being urgent.
          WARN_DAYS: "30"
        run: |
          set -euo pipefail
          expires_at=$(date -u -d "$EXPIRES" +%s)
          now=$(date -u +%s)
          days_left=$(( (expires_at - now) / 86400 ))

          echo "AGO_PLATFORM_PACKAGES_TOKEN expires $EXPIRES ($days_left days from now)."

          if [ "$days_left" -lt 0 ]; then
            echo "::error::AGO_PLATFORM_PACKAGES_TOKEN EXPIRED on $EXPIRES. CI in this repository and in ago-calendar cannot restore Ago.Platform.* until it is replaced. See ago-root docs/runbooks/secret-rotation.md."
            exit 1
          fi

          if [ "$days_left" -lt "$WARN_DAYS" ]; then
            echo "::error::AGO_PLATFORM_PACKAGES_TOKEN expires in $days_left days ($EXPIRES). Rotate it: ago-root docs/runbooks/secret-rotation.md - new PAT with read:packages only, set it in ago-chat AND ago-calendar, verify a build in each, revoke the old one last, then update EXPIRES in this workflow."
            exit 1
          fi
