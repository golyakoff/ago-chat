<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AGO Chat - dev harness (1-06, not the real widget/console)</title>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; display: flex; gap: 24px; padding: 16px; }
  .pane { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 12px; }
  .pane h2 { margin-top: 0; }
  .log { height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 8px; margin-bottom: 8px; background: #fafafa; }
  .log div { margin-bottom: 4px; }
  .log .self { color: #0a5; }
  .log .other { color: #05a; }
  .log .system { color: #999; font-style: italic; }
  .log .reconnect { color: #c60; font-weight: bold; }
  input { width: 100%; box-sizing: border-box; margin-bottom: 4px; }
  small { color: #777; }
</style>
</head>
<body>
<!-- This page exists to manually prove 1-06's "done when" (two tabs exchange messages, history
     survives a reload) and 3-03's (a dropped connection reconnects with jittered backoff and
     resumes from its last known sequence - no gap, no full replay). It is not the widget
     (ago-widget, Stage 5) or the operator console (ago-console, Stage 5) - both replace this
     outright, reconnect UX included (3-03's backlog item is explicit: this is a manual-harness
     proof of the wire protocol, not production reconnect UX).

     To exercise 3-03 by hand: open this page, send a few visitor messages, then actually kill the
     connection - stop `dotnet run` for Ago.Chat.Api and start it again (a real node death), or
     toggle the browser devtools "Offline" throttling preset for a few seconds. Watch the log for
     the "Reconnecting (attempt N, waiting Nms)" lines (the jittered backoff), then "Reconnected -
     resuming from sequence N" followed by exactly the messages sent while disconnected - not the
     whole history again. -->
<div class="pane">
  <h2>Visitor</h2>
  <small>Public key: <code>demo_site</code> (seeded by 1-05)</small>
  <div id="visitor-log" class="log"></div>
  <div>Conversation id: <code id="visitor-conversation-id">-</code></div>
  <input id="visitor-message" placeholder="Message" />
  <button onclick="sendVisitorMessage()">Send</button>
  <button onclick="resetVisitor()">Forget this visitor (clear localStorage)</button>
</div>

<div class="pane">
  <h2>Operator</h2>
  <small>Paste a token for the seeded demo operator - local-dev.md's "Getting a working operator
    session locally" has the curl command against Keycloak's own token endpoint.</small>
  <input id="operator-token" placeholder="Operator access token (from Keycloak)" style="width: 100%" />
  <button onclick="connectOperator()">Connect</button>
  <div id="operator-log" class="log"></div>
  <input id="operator-conversation-id" placeholder="Conversation id (paste from Visitor pane)" />
  <button onclick="joinConversation()">Join conversation</button>
  <input id="operator-message" placeholder="Message" />
  <button onclick="sendOperatorMessage()">Send</button>
</div>

<script>
  // `5-01`'s own manual cross-origin verification needs this page served from a *different* origin
  // than Ago.Chat.Api - every call below was root-relative until then, which only ever resolves
  // against whatever origin serves this file, never a separately-hosted Api (found live: serving
  // this page from a second static server 404'd immediately, the fetch never reached the real Api
  // at all, let alone its CORS policy). `?api=http://host:port` overrides it; same-origin usage
  // (local-dev.md's own documented flow) is unaffected since the default stays empty (relative).
  const API_BASE = new URLSearchParams(location.search).get('api') || '';

  function log(paneId, text, cls) {
    const el = document.getElementById(paneId);
    const line = document.createElement('div');
    line.className = cls || 'system';
    line.textContent = text;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  function renderMessage(paneId, m, selfKind) {
    log(paneId, `[${m.sequence}] ${m.authorKind}: ${m.body}`, m.authorKind === selfKind ? 'self' : 'other');
  }

  // 3-03: exponential backoff with full jitter (edge.md - without jitter a rolling restart becomes
  // a self-inflicted thundering herd), logged visibly so the harness demonstrates it, not just
  // performs it. SignalR calls this once per attempt; returning null stops retrying.
  function jitteredBackoff(paneId) {
    const maxDelayMs = 30000;
    let attempt = 0;
    return {
      nextRetryDelayInMilliseconds() {
        attempt++;
        if (attempt > 10) {
          log(paneId, 'Giving up reconnecting after 10 attempts.', 'reconnect');
          return null;
        }
        const cap = Math.min(1000 * 2 ** (attempt - 1), maxDelayMs);
        const delay = Math.round(Math.random() * cap);
        log(paneId, `Reconnecting (attempt ${attempt}, waiting ${delay}ms)...`, 'reconnect');
        return delay;
      },
    };
  }

  // --- Visitor ---
  let visitorConnection, visitorConversationId, visitorLastSequence = 0;

  function trackVisitorMessage(m) {
    renderMessage('visitor-log', m, 'Visitor');
    visitorLastSequence = Math.max(visitorLastSequence, m.sequence);
  }

  async function startVisitor() {
    let token = localStorage.getItem('ago-visitor-token');
    if (!token) {
      const res = await fetch(`${API_BASE}/api/v1/visitor-sessions`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ publicKey: 'demo_site' })
      });
      if (!res.ok) { log('visitor-log', `Failed to start session: ${res.status}`); return; }
      const body = await res.json();
      token = body.token;
      localStorage.setItem('ago-visitor-token', token);
      log('visitor-log', 'New visitor - fresh token issued.');
    } else {
      log('visitor-log', 'Returning visitor - reusing stored token.');
    }

    visitorConnection = new signalR.HubConnectionBuilder()
      // 3-06: skipping negotiation makes the whole handshake one WebSocket request, so it lands on
      // exactly one Ago.Chat.Api pod by construction - negotiate and a separate transport upgrade
      // are two HTTP requests, and the Gateway has no sticky sessions (edge.md) to keep them on the
      // same pod otherwise (found live, running 3 replicas for real: a negotiate handled by one pod
      // 404'd when the upgrade landed on another).
      .withUrl(`${API_BASE}/hubs/visitor?access_token=${token}`, {
        skipNegotiation: true,
        transport: signalR.HttpTransportType.WebSockets,
      })
      .withAutomaticReconnect(jitteredBackoff('visitor-log'))
      .build();
    visitorConnection.on('MessageReceived', m => trackVisitorMessage(m));
    // 3-06: ConnectionDrainCoordinator (Ago.Platform.Realtime) sends this to every connection a
    // draining node owns, telling the client to reconnect on its own schedule rather than waiting
    // to be dropped - onreconnecting/onreconnected below handle the resulting disconnect the same
    // way they handle any other one.
    visitorConnection.on('Reconnect', ({ after }) =>
      log('visitor-log', `Server requested a reconnect in ${after} (node is draining).`, 'reconnect'));
    visitorConnection.onreconnecting(error =>
      log('visitor-log', `Connection lost${error ? ': ' + error.message : ''} - reconnecting...`, 'reconnect'));
    visitorConnection.onreconnected(async () => {
      log('visitor-log', `Reconnected - resuming from sequence ${visitorLastSequence}.`, 'reconnect');
      const resumed = await visitorConnection.invoke('JoinAsync', visitorLastSequence);
      resumed.history.forEach(m => trackVisitorMessage(m));
      log('visitor-log', resumed.history.length ? `Caught up on ${resumed.history.length} missed message(s).` : 'Nothing missed.', 'reconnect');
    });
    await visitorConnection.start();

    // SignalR's binder matches invocations by argument count, not by C#'s optional-parameter
    // defaults - it does not fill in a missing trailing argument, so a fresh join must pass `null`
    // explicitly rather than omitting the argument (found by running this against a live server:
    // omitting it throws "Invocation provides 0 argument(s) but target expects 1").
    const join = await visitorConnection.invoke('JoinAsync', null);
    visitorConversationId = join.conversationId;
    document.getElementById('visitor-conversation-id').textContent = visitorConversationId;
    log('visitor-log', join.isNew ? 'New conversation started.' : 'Resumed existing conversation.');
    join.history.slice().reverse().forEach(m => trackVisitorMessage(m));
  }

  async function sendVisitorMessage() {
    const input = document.getElementById('visitor-message');
    if (!input.value || !visitorConnection) return;
    // `5-07`: SendMessageAsync now has 4 total parameters (attachmentId, then clientMessageId,
    // both `5-03`/`5-07` additions) - same argument-count binding rule as JoinAsync's own comment
    // above (local-dev.md's documented gotcha): every trailing optional must still be passed
    // explicitly, `null` here since this harness does not exercise either. Found live while
    // manually verifying `5-07`: this 2-argument call had silently been broken since `5-03` added
    // the third parameter - nothing had exercised the visitor send path against a real server since.
    await visitorConnection.invoke('SendMessageAsync', visitorConversationId, input.value, null, null);
    input.value = '';
  }

  function resetVisitor() {
    localStorage.removeItem('ago-visitor-token');
    location.reload();
  }

  startVisitor();

  // --- Operator ---
  let operatorConnection, operatorConversationId, operatorLastSequence = 0;

  function trackOperatorMessage(m) {
    renderMessage('operator-log', m, 'Operator');
    operatorLastSequence = Math.max(operatorLastSequence, m.sequence);
  }

  async function connectOperator() {
    // `5-05`: no session-issuance endpoint anymore - the token itself comes from Keycloak
    // (adr/0022), pasted in directly rather than redirected through here (the real
    // Authorization Code + PKCE redirect flow is 5-06's console, not this harness).
    const token = document.getElementById('operator-token').value;
    if (!token) { log('operator-log', 'Paste an operator token first.'); return; }

    operatorConnection = new signalR.HubConnectionBuilder()
      // 3-06: see the matching comment on visitorConnection above - same reason.
      .withUrl(`${API_BASE}/hubs/operator?access_token=${token}`, {
        skipNegotiation: true,
        transport: signalR.HttpTransportType.WebSockets,
      })
      .withAutomaticReconnect(jitteredBackoff('operator-log'))
      .build();
    operatorConnection.on('MessageReceived', m => trackOperatorMessage(m));
    operatorConnection.on('Reconnect', ({ after }) =>
      log('operator-log', `Server requested a reconnect in ${after} (node is draining).`, 'reconnect'));
    operatorConnection.onreconnecting(error =>
      log('operator-log', `Connection lost${error ? ': ' + error.message : ''} - reconnecting...`, 'reconnect'));
    operatorConnection.onreconnected(async () => {
      if (!operatorConversationId) return;
      log('operator-log', `Reconnected - resuming conversation ${operatorConversationId} from sequence ${operatorLastSequence}.`, 'reconnect');
      const page = await operatorConnection.invoke('JoinConversationAsync', operatorConversationId, operatorLastSequence);
      page.messages.forEach(m => trackOperatorMessage(m));
      log('operator-log', page.messages.length ? `Caught up on ${page.messages.length} missed message(s).` : 'Nothing missed.', 'reconnect');
    });
    await operatorConnection.start();
    log('operator-log', 'Connected.');
  }

  async function joinConversation() {
    const conversationId = document.getElementById('operator-conversation-id').value;
    if (!operatorConnection || !conversationId) return;
    // Same argument-count binding rule as JoinAsync above - null, not omitted.
    const page = await operatorConnection.invoke('JoinConversationAsync', conversationId, null);
    operatorConversationId = conversationId;
    log('operator-log', 'Joined conversation - now assigned.');
    page.messages.slice().reverse().forEach(m => trackOperatorMessage(m));
  }

  async function sendOperatorMessage() {
    const input = document.getElementById('operator-message');
    const conversationId = document.getElementById('operator-conversation-id').value;
    if (!input.value || !operatorConnection || !conversationId) return;
    // `5-07`: same fix as sendVisitorMessage's own matching comment - explicit null, not omitted.
    await operatorConnection.invoke('SendMessageAsync', conversationId, input.value, null, null);
    input.value = '';
  }
</script>
</body>
</html>
